
<!DOCTYPE html>
<html lang="tj">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLOURFLOW - Control Center</title>
    <link rel="stylesheet" href="css/main.css">
    <script src="js/api.js"></script>
    <script src="js/logic.js"></script>
</head>
<body>
    <div class="app-container">
        <nav class="sidebar">
            <div class="logo">FF</div>
            <div class="nav-links">
                <button onclick="loadPage('stock')">Остатки</button>
                <button onclick="loadPage('orders')">Заказы</button>
                <button onclick="loadPage('products')">Товары</button>
            </div>
        </nav>
        <main class="main-content">
            <div id="app-container">
                <!-- Pages load here -->
                <h1>Добро пожаловать в FLOURFLOW</h1>
                <p>Выберите раздел в меню слева.</p>
            </div>
        </main>
    </div>
    <script>
        async function loadPage(page) {
            const container = document.getElementById('app-container');
            container.innerHTML = 'Загрузка...';
            try {
                const response = await fetch(`pages/${page}.html`);
                const html = await response.text();
                container.innerHTML = html;
            } catch (e) {
                container.innerHTML = 'Ошибка загрузки страницы.';
            }
        }
    </script>
</body>
</html>
